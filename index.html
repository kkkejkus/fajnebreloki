<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FajneBreloki.pl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<body>

    <div class="promo-banner">

    </div>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span>FajneBreloki<span class="dot">.pl</span></span>
            </a>
            
            <div class="nav-search-container" id="navSearchContainer">

                    <button class="dropbtn"><span class="dropbtn-text">Kategorie</span><span class="arrow">▼</span></button>

                    </div>
                </div>

            </div>

            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="nav-links">

                <li><a href="index.html?page=faq">FAQ</a></li>
                <li><a href="index.html?page=shipping">Wysyłka</a></li>
                <li><a href="index.html?page=contact">Kontakt</a></li>
                <li><button id="themeToggle" class="theme-toggle" title="kliknij, aby przełączyć na tryb ciemny">🌤️</button></li>
            </ul>
        </div>
    </nav>

    <!-- To jest miejsce, gdzie JavaScript będzie wstawiał treść -->
    <main id="app" class="container">
        <!-- Tutaj pojawi się Landing Page lub Produkt -->
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                <span>&copy; 2025 FajneBreloki.pl by @kkkejkus</span>
                <span class="footer-separator">All rights reserved.</span>
            </p>
            <p style="margin-top: 10px; font-size: 0.8rem; opacity: 0.7;">
                <a href="index.html?page=privacy" style="color: inherit; text-decoration: none;">Polityka Prywatności</a>
            </p>
        </div>
